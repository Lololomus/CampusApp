x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    mem_limit: 1g
    memswap_limit: 1g
    logging: *json-logging
    security_opt:
      - no-new-privileges:true

  redis:
    mem_limit: 256m
    memswap_limit: 256m
    logging: *json-logging
    security_opt:
      - no-new-privileges:true

  clamav:
    # 1g мало: clamd на старте грузит main.cvd (~89 МБ сжатый → ~700 МБ в памяти),
    # daily.cvd, плюс рабочие буферы. На 1g стабильно валится OOM-killer'ом
    # (anon-rss ~1.05 ГБ) и контейнер остаётся живой, но clamd мёртвый
    # (freshclam-процесс не падает, поэтому Docker не делает restart).
    mem_limit: 2g
    memswap_limit: 2g
    # Healthcheck через clamdscan --ping: если демон лежит, exit code != 0
    # → контейнер unhealthy и restart-policy перезапустит его целиком.
    # start_period 5 минут: главная база main.cvd (~89 МБ → ~700 МБ в RAM)
    # на медленном диске может загружаться 1-3 минуты.
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    logging: *json-logging
    security_opt:
      - no-new-privileges:true

  backend:
    mem_limit: 1g
    memswap_limit: 1g
    command: ["/bin/bash", "/app/entrypoint.prod.sh"]
    volumes:
      - ${CAMPUSAPP_UPLOADS_DIR:-/srv/campusapp/uploads}:/app/uploads
      - ${CAMPUSAPP_DOCUMENTS_DIR:-/srv/campusapp/documents}:/app/private_documents
      - ${CAMPUSAPP_REPORTS_DIR:-/srv/campusapp/reports}:/app/reports
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    init: true
    logging: *json-logging

  bot:
    mem_limit: 512m
    memswap_limit: 512m
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    init: true
    logging: *json-logging

  frontend:
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CAMPUSAPP_UPLOADS_DIR:-/srv/campusapp/uploads}:/var/www/uploads:ro
      - ${CAMPUSAPP_DOCUMENTS_DIR:-/srv/campusapp/documents}:/var/www/private_documents:ro
      - ${CAMPUSAPP_ACME_DIR:-/srv/campusapp/acme}:/var/www/acme:ro
      - ${CAMPUSAPP_SSL_DIR:-/srv/campusapp/ssl}:/etc/nginx/ssl:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=384m
      - /var/cache/nginx:rw,nosuid,size=64m
      - /var/run:rw,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    init: true
    logging: *json-logging
